name: Release

# 打 tag（v1.0.0 这种）就自动出包：universal → 签名 → DMG → 公证 → staple → GitHub Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      # 证书以 base64 的 .p12 存 secret，导入到临时钥匙串
      - name: 导入 Developer ID 证书
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12
          security find-identity -v -p codesigning

      # 凭据存进临时钥匙串（不用默认钥匙串——无头 runner 上那样会让 notarytool 崩溃），
      # 这样密码不进命令行参数，只以钥匙串条目的形式存在于一次性的 runner 上
      - name: 配置公证凭据
        id: notary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if xcrun notarytool store-credentials ci \
               --keychain "$HOME/Library/Keychains/build.keychain-db" \
               --apple-id "$APPLE_ID" \
               --team-id "$APPLE_TEAM_ID" \
               --password "$APPLE_APP_PASSWORD"; then
            echo "profile=ci" >> "$GITHUB_OUTPUT"
          else
            # 无头 runner 上 store-credentials 会 SIGTRAP，这是已知现象，退回凭据直传即可
            echo "store-credentials 不可用（无头 runner 限制），改用凭据直传"
          fi

      - name: 构建 / 签名 / 公证 / 打包
        env:
          NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # 重跑同一个版本时不要因为 Release 已存在而失败
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION 已存在，跳过创建"
            exit 0
          fi
          gh release create "v$VERSION" \
            "dist/StandFifty-$VERSION.dmg" \
            "dist/StandFifty-$VERSION.dmg.sha256" \
            --title "StandFifty $VERSION" \
            --generate-notes
